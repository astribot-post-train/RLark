---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodeclasses.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: NodeClass
    listKind: NodeClassList
    plural: nodeclasses
    singular: nodeclass
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeClass is what every node of one kind registers with: a robot model, a
          GPU server. It is declared once for the whole management plane, so that the
          hundredth machine of a kind comes in the way the first did.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels and Taints (key=value:effect) are what a node of the class
                  registers with. A change of Labels reaches the nodes that have joined
                  as far as the cluster agent carries management labels to the cluster
                  (rlark.io/node-category, rlark.io/robot-* and the prefixes the agent
                  is started with); a change of Taints reaches a node when it is
                  installed anew.
                maxProperties: 32
                type: object
              taints:
                items:
                  maxLength: 317
                  type: string
                maxItems: 8
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
