---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: stations.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: Station
    listKind: StationList
    plural: stations
    shortNames:
    - stn
    singular: station
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.binding.nodeName
      name: Node
      type: string
    - jsonPath: .spec.binding.nodeUID
      name: Node UID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Station is the stable inventory record for one Kubernetes node identity.
          Its metadata.name is the business identifier; metadata.uid identifies this
          particular Kubernetes object instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              binding:
                properties:
                  boundBy:
                    description: BoundBy is set by the trusted API/controller, not
                      copied from agent input.
                    maxLength: 256
                    minLength: 1
                    type: string
                  nodeName:
                    description: NodeName is the last controller-verified Kubernetes
                      Node name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  nodeUID:
                    description: NodeUID is the Kubernetes object-instance identity
                      and must be compared exactly.
                    maxLength: 128
                    minLength: 1
                    type: string
                  systemUUID:
                    description: SystemUUID is supporting evidence only and is never
                      an authorization credential.
                    maxLength: 128
                    type: string
                  version:
                    description: Version increases for every administrator-approved
                      rebind.
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - boundBy
                - nodeName
                - nodeUID
                - version
                type: object
                x-kubernetes-validations:
                - message: a changed binding must increment version exactly once
                  rule: self == oldSelf || self.version == oldSelf.version + 1
              displayName:
                description: DisplayName is assigned once and does not follow cluster
                  rename operations.
                maxLength: 128
                minLength: 1
                type: string
              retired:
                description: Retired is durable desired state. Retired stations are
                  never auto-rebound.
                type: boolean
              sequence:
                description: Sequence is monotonically allocated within the registered
                  cluster.
                format: int64
                minimum: 1
                type: integer
            required:
            - binding
            - displayName
            - sequence
            type: object
            x-kubernetes-validations:
            - message: displayName and sequence are immutable and retirement cannot
                be reversed
              rule: self.displayName == oldSelf.displayName && self.sequence == oldSelf.sequence
                && (!has(oldSelf.retired) || !oldSelf.retired || (has(self.retired)
                && self.retired))
          status:
            properties:
              bootTime:
                format: date-time
                type: string
              conditions:
                description: Conditions are owned by station-controller.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSeenTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Bound
                - Offline
                - Conflict
                - Retired
                type: string
              reboots:
                description: |-
                  Reboots counts the boot-time changes seen since the Station was created.
                  The Rebooted condition describes the last one.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
