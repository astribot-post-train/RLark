---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: stationobservations.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: StationObservation
    listKind: StationObservationList
    plural: stationobservations
    shortNames:
    - stnobs
    singular: stationobservation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.nodeUID
      name: Node UID
      type: string
    - jsonPath: .status.reportedAt
      name: Reported
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          StationObservation holds the latest server-validated observation per node.
          Its name is the verified Node name in the namespace mapped to the cluster.
          station-api owns status; agents never write this object directly.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              StationObservationSpec is intentionally empty. The API creates the object
              before writing the validated snapshot through the status subresource.
            type: object
          status:
            properties:
              bootTime:
                format: date-time
                type: string
              nodeUID:
                maxLength: 128
                minLength: 1
                type: string
              probes:
                items:
                  properties:
                    ok:
                      type: boolean
                    rttMs:
                      format: int64
                      maximum: 600000
                      minimum: 0
                      type: integer
                    target:
                      description: Target is a configured probe label or host:port,
                        bounded by API policy.
                      maxLength: 256
                      minLength: 1
                      type: string
                    via:
                      description: Via identifies the observed route label.
                      maxLength: 256
                      type: string
                  required:
                  - ok
                  - target
                  type: object
                maxItems: 64
                type: array
              reportedAt:
                description: ReportedAt is server receipt time, never a client-provided
                  timestamp.
                format: date-time
                type: string
              roles:
                items:
                  maxLength: 64
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              systemUUID:
                description: SystemUUID is evidence only and must not be used to authorize
                  a binding.
                type: string
              wireguard:
                properties:
                  addresses:
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  interface:
                    description: Interface is the observed interface name, not a desired
                      configuration.
                    maxLength: 15
                    minLength: 1
                    type: string
                  peers:
                    items:
                      properties:
                        latestHandshake:
                          format: date-time
                          type: string
                        name:
                          description: Name is a stable, non-secret peer label assigned
                            by the server.
                          maxLength: 128
                          minLength: 1
                          type: string
                        receivedBytes:
                          format: int64
                          minimum: 0
                          type: integer
                        sentBytes:
                          format: int64
                          minimum: 0
                          type: integer
                      required:
                      - name
                      type: object
                    maxItems: 64
                    type: array
                  publicKey:
                    description: PublicKey is the public key of the observed interface;
                      private keys are never reported.
                    maxLength: 64
                    type: string
                required:
                - interface
                type: object
            required:
            - nodeUID
            - reportedAt
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
