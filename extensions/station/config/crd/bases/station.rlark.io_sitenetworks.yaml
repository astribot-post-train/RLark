---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: sitenetworks.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: SiteNetwork
    listKind: SiteNetworkList
    plural: sitenetworks
    shortNames:
    - sitenet
    singular: sitenetwork
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.pool
      name: Pool
      type: string
    - jsonPath: .status.members
      name: Members
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SiteNetwork declares one network of nodes across sites: the address pool,
          the sites, and the nodes that are more than a leaf. An administrator owns
          spec; station-controller owns status. Nodes enroll themselves with a
          NetworkEnrollment and never appear here unless they need a role.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              interface:
                default: st-wg0
                maxLength: 15
                type: string
              keepaliveSeconds:
                default: 25
                format: int32
                maximum: 3600
                minimum: 1
                type: integer
              listenPort:
                default: 51820
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              mode:
                default: Tunnel
                description: SiteNetworkMode says how the nodes of the network reach
                  each other.
                enum:
                - Tunnel
                - Routed
                type: string
              mtu:
                default: 1380
                format: int32
                maximum: 9000
                minimum: 576
                type: integer
              nodes:
                description: Nodes lists only the nodes that need more than the leaf
                  default.
                items:
                  properties:
                    address:
                      description: Address pins the tunnel address; empty lets the
                        controller allocate one.
                      maxLength: 15
                      type: string
                    advertise:
                      items:
                        properties:
                          cidr:
                            maxLength: 18
                            minLength: 9
                            type: string
                          sites:
                            description: Sites limits the receivers; empty means every
                              other site.
                            items:
                              type: string
                            maxItems: 64
                            type: array
                            x-kubernetes-list-type: set
                        required:
                        - cidr
                        type: object
                      maxItems: 16
                      type: array
                    clusterID:
                      maxLength: 128
                      minLength: 1
                      type: string
                    endpoints:
                      items:
                        properties:
                          address:
                            description: |-
                              Address is ip:port. Empty means the address the node reported at
                              enrollment and its listen port, for a hub whose address is assigned by DHCP.
                            maxLength: 21
                            type: string
                          scope:
                            enum:
                            - Public
                            - Site
                            type: string
                        required:
                        - scope
                        type: object
                      maxItems: 4
                      type: array
                    interface:
                      maxLength: 15
                      type: string
                    listenPort:
                      format: int32
                      maximum: 65535
                      minimum: 0
                      type: integer
                    nodeAddress:
                      description: |-
                        NodeAddress is the address other nodes use for this node when it is not
                        the tunnel address, for example a cloud VPC address.
                      maxLength: 15
                      type: string
                    nodeName:
                      maxLength: 253
                      minLength: 1
                      type: string
                    relay:
                      description: Relay makes a hub carry traffic between the leaves
                        that dial it.
                      type: boolean
                    role:
                      default: Leaf
                      enum:
                      - Leaf
                      - Hub
                      type: string
                    uplink:
                      description: |-
                        SiteNetworkUplink makes the node reach the endpoints it dials through a
                        given gateway and source address instead of its default route.
                      properties:
                        gateway:
                          maxLength: 15
                          type: string
                        interface:
                          maxLength: 15
                          minLength: 1
                          type: string
                        source:
                          maxLength: 15
                          type: string
                      required:
                      - gateway
                      - interface
                      - source
                      type: object
                  required:
                  - clusterID
                  - nodeName
                  type: object
                maxItems: 256
                type: array
              pool:
                description: Pool is the IPv4 prefix tunnel addresses are allocated
                  from.
                maxLength: 18
                minLength: 9
                type: string
                x-kubernetes-validations:
                - message: pool is immutable
                  rule: self == oldSelf
              sites:
                items:
                  properties:
                    clusters:
                      description: Clusters are the registered RLark Cluster IDs whose
                        nodes are in this site.
                      items:
                        type: string
                      maxItems: 256
                      type: array
                      x-kubernetes-list-type: set
                    mesh:
                      description: Mesh links the hubs of this site to each other
                        over the tunnel.
                      type: boolean
                    name:
                      maxLength: 63
                      minLength: 1
                      type: string
                    reaches:
                      description: Reaches lists the sites whose Site-scoped endpoints
                        this site can dial.
                      items:
                        type: string
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - name
                  type: object
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - pool
            - sites
            type: object
          status:
            properties:
              allocations:
                description: |-
                  Allocations are durable: an address stays with its Station identity
                  across rebinds and is released only when the identity is retired.
                items:
                  properties:
                    address:
                      maxLength: 15
                      minLength: 7
                      type: string
                    clusterID:
                      type: string
                    nodeName:
                      type: string
                    stationUID:
                      maxLength: 128
                      minLength: 1
                      type: string
                  required:
                  - address
                  - clusterID
                  - nodeName
                  - stationUID
                  type: object
                maxItems: 4096
                type: array
                x-kubernetes-list-map-keys:
                - stationUID
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              members:
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
              unreachable:
                description: Unreachable lists the first ordered pairs of members
                  with no path.
                items:
                  type: string
                maxItems: 32
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
