---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodeadmissions.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: NodeAdmission
    listKind: NodeAdmissionList
    plural: nodeadmissions
    shortNames:
    - admit
    singular: nodeadmission
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeAdmission lets one machine that is not yet a node join: an operator
          writes it and hands the machine the one-time code whose hash it holds. The
          machine redeems the code at Station API with its WireGuard public key and
          receives its tunnel configuration and what it needs to join the cluster.
          The admission stays afterwards as the node's network declaration. Its name
          is the Node name in the namespace mapped to the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              address:
                description: Address pins the tunnel address; empty lets the controller
                  allocate one.
                maxLength: 15
                type: string
              apiServer:
                description: |-
                  APIServer is the host:port of the cluster's API the machine joins at;
                  it must be reachable from the machine without the tunnel.
                maxLength: 253
                minLength: 3
                type: string
              apiServerAddress:
                description: |-
                  APIServerAddress is the address the host of APIServer resolves to when
                  that host is a name (cp.<cluster-id>.rlark.internal): the installer
                  writes it into the machine's /etc/hosts, in a line of its own. The
                  name is what lets a control plane move to another machine without the
                  nodes' certificates and kubeconfigs changing.
                maxLength: 45
                type: string
              clusterID:
                maxLength: 128
                minLength: 1
                type: string
              codeHash:
                description: |-
                  CodeHash is the SHA-256 of the one-time code in hex. The code itself is
                  shown once to the operator and stored nowhere.
                maxLength: 64
                minLength: 64
                type: string
              expiresAt:
                description: ExpiresAt ends the time in which the code can be redeemed.
                format: date-time
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels and Taints (key=value:effect) are what the node
                  registers with.
                maxProperties: 32
                type: object
              listenPort:
                format: int32
                maximum: 65535
                minimum: 0
                type: integer
              publicKey:
                description: |-
                  PublicKey is written by Station API when the code is redeemed; the code
                  then stays valid for this key only.
                maxLength: 44
                type: string
              redeemedAt:
                description: RedeemedAt is when Station API accepted the code.
                format: date-time
                type: string
              taints:
                items:
                  maxLength: 317
                  type: string
                maxItems: 8
                type: array
              uplink:
                description: |-
                  SiteNetworkUplink makes the node reach the endpoints it dials through a
                  given gateway and source address instead of its default route.
                properties:
                  gateway:
                    maxLength: 15
                    type: string
                  interface:
                    maxLength: 15
                    minLength: 1
                    type: string
                  source:
                    maxLength: 15
                    type: string
                required:
                - gateway
                - interface
                - source
                type: object
            required:
            - apiServer
            - clusterID
            - codeHash
            - expiresAt
            type: object
          status:
            properties:
              address:
                description: Address is the tunnel address; once set it stays with
                  this admission.
                type: string
              config:
                description: |-
                  Config is the document station-gateway reconciles until the node has
                  enrolled under its own identity, for PublicKey.
                maxLength: 262144
                type: string
              configHash:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Redeemed
                - Joined
                - Expired
                type: string
              publicKey:
                type: string
              reason:
                maxLength: 512
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
