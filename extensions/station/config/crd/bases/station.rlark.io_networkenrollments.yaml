---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: networkenrollments.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: NetworkEnrollment
    listKind: NetworkEnrollmentList
    plural: networkenrollments
    shortNames:
    - netenroll
    singular: networkenrollment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.site
      name: Site
      type: string
    - jsonPath: .status.role
      name: Role
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkEnrollment is one node's request to join the SiteNetwork and the
          answer to it. station-api writes spec from the node's verified identity and
          its report; station-controller writes status. Its name is the Node name in
          the namespace mapped to the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              addresses:
                description: |-
                  Addresses are the node's own addresses as it reported them, the first
                  being the source it uses towards station-api.
                items:
                  maxLength: 15
                  type: string
                maxItems: 8
                type: array
              bindingVersion:
                format: int64
                minimum: 1
                type: integer
              clusterID:
                maxLength: 128
                minLength: 1
                type: string
              nodeUID:
                maxLength: 128
                minLength: 1
                type: string
              observedSource:
                description: |-
                  ObservedSource is the address station-api saw the request arrive from.
                  It differs from Addresses when the node is behind NAT.
                maxLength: 45
                type: string
              publicKey:
                description: |-
                  PublicKey is the node's WireGuard public key; the private key never
                  leaves the node. Empty for a node that runs no tunnel.
                maxLength: 44
                type: string
              stationUID:
                description: |-
                  StationUID and BindingVersion are the identity the request was verified
                  against; the controller rejects the enrollment when they are no longer current.
                maxLength: 128
                minLength: 1
                type: string
            required:
            - bindingVersion
            - clusterID
            - nodeUID
            - stationUID
            type: object
          status:
            properties:
              address:
                description: Address is the one address every other member reaches
                  this node at.
                type: string
              config:
                description: Config is the document station-gateway reconciles, for
                  PublicKey.
                maxLength: 262144
                type: string
              configHash:
                description: ConfigHash is the SHA-256 of Config in hex.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Enrolled
                - Rejected
                type: string
              problems:
                items:
                  type: string
                maxItems: 16
                type: array
              publicKey:
                description: PublicKey is the key Config was computed for.
                type: string
              reason:
                description: Reason explains Pending and Rejected in one line.
                maxLength: 512
                type: string
              role:
                type: string
              site:
                type: string
              tunnelAddress:
                description: TunnelAddress is the node's address inside the tunnel,
                  when it has one.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
