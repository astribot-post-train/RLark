# Replace the images, endpoint, cluster ID, registry credentials and network ConfigMap.
# Label network nodes station.rlark.io/network=enabled; other nodes run identity only.
# The network ConfigMap must contain <node-name>.json for each enabled node.
# Preserve each node private.key in /var/lib/station/wg.
apiVersion: v1
kind: ConfigMap
metadata:
  name: station-agent
  namespace: station-system
data:
  api-url: https://REPLACE_STATION_API_ENDPOINT
  cluster-id: REPLACE_REGISTERED_CLUSTER_ID
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: station-agent
  namespace: station-system
spec:
  selector:
    matchLabels:
      app: station-agent
  template:
    metadata:
      labels:
        app: station-agent
    spec:
      serviceAccountName: station-agent
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
      containers:
      - name: station-agent
        image: REPLACE_RLARK_IMAGE
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/station-agent
        args:
        - --api-url=$(STATION_API_URL)
        - --cluster-id=$(STATION_CLUSTER_ID)
        - --token-file=/var/run/secrets/station/token
        - --ca-file=$(STATION_API_CA_FILE)
        - --interval=30s
        - --request-timeout=10s
        env:
        - name: STATION_API_URL
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: api-url
        - name: STATION_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: cluster-id
        - name: STATION_API_CA_FILE
          value: /var/run/secrets/station-api-ca/ca.crt
        ports:
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: token
          mountPath: /var/run/secrets/station
          readOnly: true
        - name: station-api-ca
          mountPath: /var/run/secrets/station-api-ca
          readOnly: true
      volumes:
      - name: token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: station.rlark.io
              expirationSeconds: 600
      - name: station-api-ca
        secret:
          secretName: station-api-ca
          items:
          - key: ca.crt
            path: ca.crt
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: station.rlark.io/network
                operator: NotIn
                values:
                - enabled
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: station-agent-network
  namespace: station-system
spec:
  selector:
    matchLabels:
      app: station-agent-network
  template:
    metadata:
      labels:
        app: station-agent-network
    spec:
      serviceAccountName: station-agent
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
      containers:
      - name: station-agent
        image: REPLACE_RLARK_IMAGE
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/station-agent
        args:
        - --api-url=$(STATION_API_URL)
        - --cluster-id=$(STATION_CLUSTER_ID)
        - --token-file=/var/run/secrets/station/token
        - --ca-file=$(STATION_API_CA_FILE)
        - --interval=30s
        - --request-timeout=10s
        - --probe-address=:18082
        - --wireguard-observation-file=/var/run/station-observation/wireguard.json
        env:
        - name: STATION_API_URL
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: api-url
        - name: STATION_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: cluster-id
        - name: STATION_API_CA_FILE
          value: /var/run/secrets/station-api-ca/ca.crt
        ports:
        - name: health
          containerPort: 18082
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: token
          mountPath: /var/run/secrets/station
          readOnly: true
        - name: station-api-ca
          mountPath: /var/run/secrets/station-api-ca
          readOnly: true
        - name: wireguard-observation
          mountPath: /var/run/station-observation
          readOnly: true
      - name: wireguard
        image: REPLACE_PRIVATE_WIREGUARD_IMAGE
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: STATION_GATEWAY_CONFIG
          value: /config/$(NODE_NAME).json
        - name: STATION_GATEWAY_OBSERVATION_FILE
          value: /var/run/station-observation/wireguard.json
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
        volumeMounts:
        - name: wireguard-config
          mountPath: /config
          readOnly: true
        - name: wireguard-key
          mountPath: /var/lib/station/wg
        - name: wireguard-observation
          mountPath: /var/run/station-observation
        readinessProbe:
          exec:
            command:
            - /station-gateway
            - --check
          periodSeconds: 10
          failureThreshold: 1
      volumes:
      - name: token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: station.rlark.io
              expirationSeconds: 600
      - name: station-api-ca
        secret:
          secretName: station-api-ca
          items:
          - key: ca.crt
            path: ca.crt
      - name: wireguard-config
        configMap:
          name: station-wireguard-config
      - name: wireguard-key
        hostPath:
          path: /var/lib/station/wg
          type: Directory
      - name: wireguard-observation
        emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: station.rlark.io/network
                operator: In
                values:
                - enabled
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
