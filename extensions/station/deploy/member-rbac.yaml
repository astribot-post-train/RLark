apiVersion: v1
kind: Namespace
metadata:
  name: station-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station-agent
  namespace: station-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station-api-reader
  namespace: station-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: station-api-member-reader
  namespace: station-system
rules:
- apiGroups: [""]
  resources: ["pods", "serviceaccounts"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: station-api-member-reader
  namespace: station-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: station-api-member-reader
subjects:
- kind: ServiceAccount
  name: station-api-reader
  namespace: station-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: station-api-member-identity
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: station-api-member-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: station-api-member-identity
subjects:
- kind: ServiceAccount
  name: station-api-reader
  namespace: station-system
