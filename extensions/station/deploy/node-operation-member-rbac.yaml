# Apply only to a member cluster explicitly authorized for node operations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station-node-operator
  namespace: station-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: station-node-operator
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "update", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs: ["create"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: station-node-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: station-node-operator
subjects:
- kind: ServiceAccount
  name: station-node-operator
  namespace: station-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: station-node-wireguard-config
  namespace: station-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["station-wireguard-config"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: station-node-wireguard-config
  namespace: station-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: station-node-wireguard-config
subjects:
- kind: ServiceAccount
  name: station-node-operator
  namespace: station-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: station-node-bootstrap
  namespace: kube-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["kubeadm-config"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: station-node-bootstrap
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: station-node-bootstrap
subjects:
- kind: ServiceAccount
  name: station-node-operator
  namespace: station-system
