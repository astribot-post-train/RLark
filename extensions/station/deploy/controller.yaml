apiVersion: v1
kind: Namespace
metadata:
  name: station-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: station-member-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station-controller
  namespace: station-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: station-controller
  namespace: station-system
spec:
  replicas: 1
  # On a host-network node the probe port is the node's: the old pod must be
  # gone before the new one binds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: station-controller
  template:
    metadata:
      labels:
        app: station-controller
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: cailiang
      # Critical, and tolerating whatever the node is tainted with: under
      # disk pressure a kubelet turns away every other Pod, and one that is
      # turned away loses its image.
      priorityClassName: system-cluster-critical
      tolerations:
      - operator: Exists
      serviceAccountName: station-controller
      automountServiceAccountToken: false
      containers:
      - name: controller
        image: REPLACE_IMAGE
        imagePullPolicy: IfNotPresent
        args:
        - --management-kubeconfig=/var/run/secrets/station/management.kubeconfig
        - --member-credentials-namespace=station-member-credentials
        - --metrics-bind-address=127.0.0.1:0
        - --health-probe-bind-address=127.0.0.1:8081
        readinessProbe:
          httpGet:
            path: /readyz
            host: 127.0.0.1
            port: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            host: 127.0.0.1
            port: 8081
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: management-kubeconfig
          mountPath: /var/run/secrets/station
          readOnly: true
      volumes:
      - name: management-kubeconfig
        secret:
          secretName: station-management-kubeconfig-controller
          items:
          - key: kubeconfig
            path: management.kubeconfig
