# Replace the images, endpoint, cluster ID and registry credentials.
# Label network nodes station.rlark.io/network=enabled; other nodes run identity only.
# A network node enrolls itself: the wireguard container publishes its public
# key, the station-agent container registers it with Station API and stores the
# computed configuration, and the wireguard container reconciles it. Nothing is
# written per node. station-wireguard-config is optional and holds a static
# <node-name>.json only for a node that cannot reach Station API without the
# tunnel (see docs/design/station-v2.zh-CN.md, "引导").
# Each node keeps private.key and last-applied.json in /var/lib/station/wg.
apiVersion: v1
kind: ConfigMap
metadata:
  name: station-agent
  namespace: station-system
data:
  api-url: https://REPLACE_STATION_API_ENDPOINT
  cluster-id: REPLACE_REGISTERED_CLUSTER_ID
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: station-agent
  namespace: station-system
spec:
  selector:
    matchLabels:
      app: station-agent
  template:
    metadata:
      labels:
        app: station-agent
    spec:
      serviceAccountName: station-agent
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
      containers:
      - name: station-agent
        image: REPLACE_RLARK_IMAGE
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/station-agent
        args:
        - --api-url=$(STATION_API_URL)
        - --cluster-id=$(STATION_CLUSTER_ID)
        - --token-file=/var/run/secrets/station/token
        - --ca-file=$(STATION_API_CA_FILE)
        - --interval=30s
        - --request-timeout=10s
        env:
        - name: STATION_API_URL
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: api-url
        - name: STATION_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: cluster-id
        - name: STATION_API_CA_FILE
          value: /var/run/secrets/station-api-ca/ca.crt
        ports:
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: token
          mountPath: /var/run/secrets/station
          readOnly: true
        - name: station-api-ca
          mountPath: /var/run/secrets/station-api-ca
          readOnly: true
      volumes:
      - name: token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: station.rlark.io
              expirationSeconds: 600
      - name: station-api-ca
        secret:
          secretName: station-api-ca
          items:
          - key: ca.crt
            path: ca.crt
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: station.rlark.io/network
                operator: NotIn
                values:
                - enabled
                - host
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: station-agent-network
  namespace: station-system
spec:
  selector:
    matchLabels:
      app: station-agent-network
  template:
    metadata:
      labels:
        app: station-agent-network
    spec:
      serviceAccountName: station-agent
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
      containers:
      - name: station-agent
        image: REPLACE_RLARK_IMAGE
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/station-agent
        args:
        - --api-url=$(STATION_API_URL)
        - --cluster-id=$(STATION_CLUSTER_ID)
        - --token-file=/var/run/secrets/station/token
        - --ca-file=$(STATION_API_CA_FILE)
        - --interval=30s
        - --request-timeout=10s
        - --probe-address=:18082
        - --wireguard-observation-file=/var/run/station-observation/wireguard.json
        - --network-identity-file=/var/run/station-observation/identity.json
        - --network-config-file=/var/run/station-network/config.json
        env:
        - name: STATION_API_URL
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: api-url
        - name: STATION_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: cluster-id
        - name: STATION_API_CA_FILE
          value: /var/run/secrets/station-api-ca/ca.crt
        ports:
        - name: health
          containerPort: 18082
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: token
          mountPath: /var/run/secrets/station
          readOnly: true
        - name: station-api-ca
          mountPath: /var/run/secrets/station-api-ca
          readOnly: true
        - name: wireguard-observation
          mountPath: /var/run/station-observation
          readOnly: true
        - name: wireguard-computed
          mountPath: /var/run/station-network
      - name: wireguard
        image: REPLACE_PRIVATE_WIREGUARD_IMAGE
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: STATION_GATEWAY_CONFIG
          value: /config/$(NODE_NAME).json
        - name: STATION_GATEWAY_OBSERVATION_FILE
          value: /var/run/station-observation/wireguard.json
        - name: STATION_GATEWAY_IDENTITY_FILE
          value: /var/run/station-observation/identity.json
        - name: STATION_GATEWAY_COMPUTED_CONFIG
          value: /var/run/station-network/config.json
        - name: STATION_GATEWAY_PRUNE_ROUTES
          value: "true"
        - name: STATION_GATEWAY_HOSTS_FILE
          value: /host/etc/hosts
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
        volumeMounts:
        - name: wireguard-config
          mountPath: /config
          readOnly: true
        - name: wireguard-key
          mountPath: /var/lib/station/wg
        - name: wireguard-observation
          mountPath: /var/run/station-observation
        - name: wireguard-computed
          mountPath: /var/run/station-network
          readOnly: true
        - name: hosts
          mountPath: /host/etc/hosts
        readinessProbe:
          exec:
            command:
            - /station-gateway
            - --check
          periodSeconds: 10
          failureThreshold: 1
      volumes:
      - name: token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: station.rlark.io
              expirationSeconds: 600
      - name: station-api-ca
        secret:
          secretName: station-api-ca
          items:
          - key: ca.crt
            path: ca.crt
      - name: wireguard-config
        configMap:
          name: station-wireguard-config
          optional: true
      - name: wireguard-key
        hostPath:
          path: /var/lib/station/wg
          type: DirectoryOrCreate
      - name: wireguard-observation
        emptyDir: {}
      - name: wireguard-computed
        emptyDir: {}
      # The site's names (SiteNetwork, names) are kept in the node's hosts file.
      - name: hosts
        hostPath:
          path: /etc/hosts
          type: File
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: station.rlark.io/network
                operator: In
                values:
                - enabled
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
---
# A node whose station-gateway is a host service (installed by the node
# bootstrap, started before the kubelet) is labelled
# station.rlark.io/network=host and runs only the agent: it reads the public key
# the host service publishes in /run/station-observation and stores the
# computed configuration in /run/station-network, where the service reads it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: station-agent-host
  namespace: station-system
spec:
  selector:
    matchLabels:
      app: station-agent-host
  template:
    metadata:
      labels:
        app: station-agent-host
    spec:
      # Pod networking does not cross the NAT such a node sits behind.
      hostNetwork: true
      serviceAccountName: station-agent
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
      containers:
      - name: station-agent
        image: REPLACE_RLARK_IMAGE
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/station-agent
        args:
        - --api-url=$(STATION_API_URL)
        - --cluster-id=$(STATION_CLUSTER_ID)
        - --token-file=/var/run/secrets/station/token
        - --ca-file=$(STATION_API_CA_FILE)
        - --interval=30s
        - --request-timeout=10s
        - --probe-address=:18082
        - --wireguard-observation-file=/var/run/station-observation/wireguard.json
        - --network-identity-file=/var/run/station-observation/identity.json
        - --network-config-file=/var/run/station-network/config.json
        env:
        - name: STATION_API_URL
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: api-url
        - name: STATION_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: station-agent
              key: cluster-id
        - name: STATION_API_CA_FILE
          value: /var/run/secrets/station-api-ca/ca.crt
        ports:
        - name: health
          containerPort: 18082
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: token
          mountPath: /var/run/secrets/station
          readOnly: true
        - name: station-api-ca
          mountPath: /var/run/secrets/station-api-ca
          readOnly: true
        - name: wireguard-observation
          mountPath: /var/run/station-observation
          readOnly: true
        - name: wireguard-computed
          mountPath: /var/run/station-network
      volumes:
      - name: token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: station.rlark.io
              expirationSeconds: 600
      - name: station-api-ca
        secret:
          secretName: station-api-ca
          items:
          - key: ca.crt
            path: ca.crt
      - name: wireguard-observation
        hostPath:
          path: /run/station-observation
          type: Directory
      - name: wireguard-computed
        hostPath:
          path: /run/station-network
          type: Directory
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: station.rlark.io/network
                operator: In
                values:
                - host
      hostNetwork: true
      dnsPolicy: Default
