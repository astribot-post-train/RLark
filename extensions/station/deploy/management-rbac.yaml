apiVersion: v1
kind: Namespace
metadata:
  name: station-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: station-member-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station-api
  namespace: station-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: station-controller
  namespace: station-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: station-api-management
rules:
- apiGroups: ["rlinf.io"]
  resources: ["clusters"]
  verbs: ["get", "list"]
- apiGroups: ["station.rlark.io"]
  resources: ["stations"]
  verbs: ["get", "list"]
- apiGroups: ["station.rlark.io"]
  resources: ["stationobservations"]
  verbs: ["get", "create", "patch"]
- apiGroups: ["station.rlark.io"]
  resources: ["stationobservations/status"]
  verbs: ["get", "patch"]
- apiGroups: ["station.rlark.io"]
  resources: ["networkenrollments"]
  verbs: ["get", "create", "update"]
- apiGroups: ["station.rlark.io"]
  resources: ["nodeadmissions"]
  verbs: ["list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: station-api-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: station-api-management
subjects:
- kind: ServiceAccount
  name: station-api
  namespace: station-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: station-controller-management
rules:
- apiGroups: ["rlinf.io"]
  resources: ["clusters", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["station.rlark.io"]
  resources: ["stationobservations"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["station.rlark.io"]
  resources: ["stations"]
  verbs: ["get", "list", "watch", "create", "patch"]
- apiGroups: ["station.rlark.io"]
  resources: ["stations/status"]
  verbs: ["get", "patch"]
- apiGroups: ["station.rlark.io"]
  resources: ["stationsequences"]
  verbs: ["get", "create"]
- apiGroups: ["station.rlark.io"]
  resources: ["stationsequences/status"]
  verbs: ["get", "patch"]
- apiGroups: ["station.rlark.io"]
  resources: ["stationrebinds"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["station.rlark.io"]
  resources: ["stationrebinds/status"]
  verbs: ["get", "patch"]
- apiGroups: ["station.rlark.io"]
  resources: ["stationauditevents"]
  verbs: ["get", "create"]
- apiGroups: ["station.rlark.io"]
  resources: ["sitenetworks", "networkenrollments", "nodeadmissions"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["station.rlark.io"]
  resources: ["sitenetworks/status", "networkenrollments/status", "nodeadmissions/status"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: station-controller-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: station-controller-management
subjects:
- kind: ServiceAccount
  name: station-controller
  namespace: station-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: station-controller-management-leader-election
  namespace: station-system
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "patch", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: station-controller-management-leader-election
  namespace: station-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: station-controller-management-leader-election
subjects:
- kind: ServiceAccount
  name: station-controller
  namespace: station-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: station-api-member-credentials
  namespace: station-member-credentials
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: station-api-member-credentials
  namespace: station-member-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: station-api-member-credentials
subjects:
- kind: ServiceAccount
  name: station-api
  namespace: station-system
