                        the container's IP.
                      type: string
                    name:
                      type: string
                    nodeUID:
                      description: NodeUID is required to start an existing node;
                        empty means create only.
                      type: string
                    port:
                      default: 22
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    privateAddress:
                      description: PrivateAddress optionally pins the address discovered
                        inside the Notebook.
                      type: string
                    role:
