# Dedicated platform-administrator Gateway management identity. It cannot read Secrets,
# dispatch Tasks, write observed status, release allocations or delete nodes.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: container-runtime-management
rules:
  - apiGroups: ["rlinf.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["rlinf.io"]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: ["containers.rlark.io"]
    resources: ["containerclusters"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["containers.rlark.io"]
    resources: ["containernodes", "containerallocations", "agentupgrades", "agentreleases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: container-runtime-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: container-runtime-management
subjects:
  - kind: ServiceAccount
    name: rlark-gateway
    namespace: rlark-system
