# Optional additive permissions for --enable-agent-upgrades=true.
# Apply alongside container-runtime-api.yaml; no operation/allocation creation,
# metadata/finalizer mutation, deletion, signing or Kubernetes proxy is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: container-runtime-api-upgrades
rules:
  - apiGroups: ["containers.rlark.io"]
    resources: ["agentupgrades", "containerallocations"]
    verbs: ["get"]
  - apiGroups: ["containers.rlark.io"]
    resources: ["agentupgrades/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: container-runtime-api-upgrades
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: container-runtime-api-upgrades
subjects:
  - kind: ServiceAccount
    name: container-runtime-api
    namespace: rlark-system
