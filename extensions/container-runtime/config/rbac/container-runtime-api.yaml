apiVersion: v1
kind: ServiceAccount
metadata:
  name: container-runtime-api
  namespace: rlark-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: container-runtime-api
rules:
  - apiGroups: ["rlinf.io"]
    resources: ["clusters", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["containers.rlark.io"]
    resources: ["containerclusters", "containernodes", "agentreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["containers.rlark.io"]
    resources: ["containernodes/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: container-runtime-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: container-runtime-api
subjects:
  - kind: ServiceAccount
    name: container-runtime-api
    namespace: rlark-system
