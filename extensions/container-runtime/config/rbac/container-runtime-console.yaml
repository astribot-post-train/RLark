# Dedicated platform-administrator console identity. It cannot read Secrets,
# dispatch Tasks, write observed status, release allocations or delete nodes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: container-runtime-console
  namespace: rlark-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: container-runtime-console
rules:
  - apiGroups: ["rlinf.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["rlinf.io"]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: ["containers.rlark.io"]
    resources: ["containerclusters"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["containers.rlark.io"]
    resources: ["containernodes", "containerallocations", "agentupgrades", "agentreleases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: container-runtime-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: container-runtime-console
subjects:
  - kind: ServiceAccount
    name: container-runtime-console
    namespace: rlark-system
