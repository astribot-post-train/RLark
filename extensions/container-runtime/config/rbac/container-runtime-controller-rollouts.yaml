# Additive role; install only for --enable-agent-rollouts=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: container-runtime-controller-rollouts
rules:
  - apiGroups: ["containers.rlark.io"]
    resources: ["agentupgrades"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: container-runtime-controller-rollouts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: container-runtime-controller-rollouts
subjects:
  - kind: ServiceAccount
    name: container-runtime-controller
    namespace: rlark-system
