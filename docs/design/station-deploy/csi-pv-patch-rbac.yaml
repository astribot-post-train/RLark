# Temporary compatibility grant for the deployed older CSI Addon.
# Remove both objects after verifying the Addon-managed role grants patch on PVs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rlark-station-csi-pv-patch
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rlark-station-csi-pv-patch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rlark-station-csi-pv-patch
subjects:
  - kind: ServiceAccount
    name: csi-driver-rclone
    namespace: rlark-system
