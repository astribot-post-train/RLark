apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-trust
  namespace: rlark-system
  labels:
    app: registry-trust
spec:
  selector:
    matchLabels:
      app: registry-trust
  template:
    metadata:
      labels:
        app: registry-trust
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 1
      containers:
        - name: install
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              # The registry config directory is the one of the container runtime this
              # node's kubelet uses (containerd, containerd-robot, containerd-fleet ...).
              endpoint=$(tr '\0' '\n' < /proc/$(pidof kubelet | cut -d' ' -f1)/cmdline | sed -n 's/^--container-runtime-endpoint=//p')
              [ -n "$endpoint" ] || endpoint=$(sed -n 's/^containerRuntimeEndpoint: *//p' /host/var/lib/kubelet/config.yaml | tr -d '"')
              runtime=$(basename "$(dirname "${endpoint#unix://}")")
              certs=$(sed -n 's/^ *config_path *= *"\([^":]*\).*/\1/p' "/host/etc/$runtime/config.toml" | head -n 1)
              certs=${certs:-/etc/$runtime/certs.d}
              for host in $(echo "$HOSTS" | tr ',' ' '); do
                mkdir -p "/host$certs/$host"
                printf '%s\n' "$CA_CERT" > "/host$certs/$host/ca.crt"
                printf 'server = "https://%s"\n\n[host."https://%s"]\n  capabilities = ["pull", "resolve"]\n  ca = "%s/%s/ca.crt"\n' "$host" "$host" "$certs" "$host" > "/host$certs/$host/hosts.toml"
                echo "trusted $host in $certs"
              done
              while :; do sleep 3600; done
          env:
            - name: HOSTS
              value: "{{ .Values.hosts }}"
            - name: CA_CERT
              value: |
{{ indent 16 .Values.caCert }}
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
          volumeMounts:
            - name: host-etc
              mountPath: /host/etc
            - name: kubelet
              mountPath: /host/var/lib/kubelet
              readOnly: true
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
