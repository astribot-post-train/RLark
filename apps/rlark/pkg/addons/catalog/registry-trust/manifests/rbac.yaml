apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-trust
  namespace: rlark-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rlark-registry-trust
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rlark-registry-trust
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rlark-registry-trust
subjects:
  - kind: ServiceAccount
    name: registry-trust
    namespace: rlark-system
