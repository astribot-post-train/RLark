apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .AddonName }}
  namespace: rlark-system
data:
  config.yml: |
    version: 0.1
    log:
      level: warn
    storage:
{{- if eq .Values.role "cache" }}
      filesystem:
        rootdirectory: /var/lib/registry
    proxy:
      remoteurl: {{ .Values.upstream }}
      ttl: {{ .Values.ttl }}
{{- else }}
      s3:
        bucket: {{ .Values.s3Bucket }}
        region: {{ .Values.s3Region }}
        regionendpoint: {{ .Values.s3Endpoint }}
        rootdirectory: {{ .Values.s3RootDirectory }}
        chunksize: 5242880
        secure: true
        v4auth: true
{{- end }}
{{- if eq .Values.role "mirror" }}
      maintenance:
        readonly:
          enabled: true
        uploadpurging:
          enabled: false
      redirect:
        disable: false
    http:
      addr: {{ .Values.listen }}
{{- else }}
{{- if eq .Values.role "registry" }}
      redirect:
        disable: true
{{- end }}
    http:
      addr: {{ .Values.listen }}
      tls:
        certificate: /run/site-registry/tls.crt
        key: /run/site-registry/tls.key
    auth:
      htpasswd:
        realm: RLark registry
        path: /run/site-registry/htpasswd
{{- end }}
{{- if eq .Values.role "cache" }}
  upstream-ca.crt: |
{{ indent 4 .Values.caCert }}
{{- end }}
