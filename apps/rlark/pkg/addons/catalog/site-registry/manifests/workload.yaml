apiVersion: apps/v1
kind: {{ if eq .Values.role "mirror" }}DaemonSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ .AddonName }}
  namespace: rlark-system
  labels:
    app: {{ .AddonName }}
spec:
{{- if ne .Values.role "mirror" }}
  replicas: 1
  strategy:
    type: Recreate
{{- end }}
  selector:
    matchLabels:
      app: {{ .AddonName }}
  template:
    metadata:
      labels:
        app: {{ .AddonName }}
      annotations:
        rlark.io/config: {{ printf "%s|%s|%s|%s|%s|%s|%s|%s" .Values.listen .Values.s3Bucket .Values.s3Region .Values.s3Endpoint .Values.s3RootDirectory .Values.upstream .Values.ttl .Values.caCert | printf "%q" }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
{{- if eq .Values.role "mirror" }}
      tolerations:
        - operator: Exists
{{- else }}
      nodeSelector:
        {{ index (splitList "=" .Values.nodeSelector) 0 }}: {{ index (splitList "=" .Values.nodeSelector) 1 | printf "%q" }}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
{{- end }}
      containers:
        - name: registry
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          args: [/etc/distribution/config.yml]
          env:
            - name: OTEL_TRACES_EXPORTER
              value: none
{{- if eq .Values.role "cache" }}
            - name: REGISTRY_PROXY_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.secret }}, key: proxy-username}}
            - name: REGISTRY_PROXY_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secret }}, key: proxy-password}}
            - name: SSL_CERT_FILE
              value: /etc/distribution/upstream-ca.crt
{{- else }}
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secret }}, key: s3-accesskey}}
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secret }}, key: s3-secretkey}}
{{- end }}
            - name: REGISTRY_HTTP_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secret }}, key: http-secret}}
          readinessProbe:
            tcpSocket:
              host: {{ index (splitList ":" .Values.listen) 0 | printf "%q" }}
              port: {{ index (splitList ":" .Values.listen) 1 }}
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/distribution
{{- if eq .Values.role "cache" }}
            - name: cache
              mountPath: /var/lib/registry
{{- end }}
{{- if ne .Values.role "mirror" }}
            - name: credentials
              mountPath: /run/site-registry
              readOnly: true
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .AddonName }}
{{- if eq .Values.role "cache" }}
        - name: cache
          hostPath:
            path: {{ .Values.cacheDir }}
            type: DirectoryOrCreate
{{- end }}
{{- if ne .Values.role "mirror" }}
        - name: credentials
          secret:
            secretName: {{ .Values.secret }}
            items:
              - {key: htpasswd, path: htpasswd}
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
{{- end }}
