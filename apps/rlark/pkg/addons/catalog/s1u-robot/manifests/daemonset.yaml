# The S1U robot x86's model configuration (extensions/s1u): the node tuner, the Orin, the power, the video and the clock, one Pod on every
# S1U robot. Privileged in the host's PID namespace (tuner, clock): it writes the host's /etc, /boot/grub and sysfs.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: s1u-robot
  namespace: rlark-system
  labels:
    app.kubernetes.io/name: s1u-robot
spec:
  # Every robot gets a new version by itself, at once. Each Pod serves its own robot only, so nothing is gained by
  # replacing them one after another, and with a budget a robot that is away uses it up: its Pod stays Terminating
  # for as long as it is away and no other robot is updated (11-14: s1u_02 cut off kept the old version from s1u_01).
  # What a new version does on a robot in use is held back on that robot (its idle checks and the rollout's waves),
  # not by the rollout of the Pods.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  selector:
    matchLabels:
      app.kubernetes.io/name: s1u-robot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s1u-robot
    spec:
      nodeSelector:
        {{ index (splitList "=" .Values.nodeSelector) 0 }}: "{{ index (splitList "=" .Values.nodeSelector) 1 }}"
      # The robot's own layer stays through what keeps other Pods off a node: its category's taints, a cordon, the
      # node's pressure, a node not ready or cut off from the API server. Not out-of-service: a robot declared gone is
      # gone.
      tolerations:
        - {key: rlark.io/node-category, operator: Exists}
        - {key: node-role.kubernetes.io/control-plane, operator: Exists}
        - {key: node.kubernetes.io/unschedulable, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/disk-pressure, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/memory-pressure, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/pid-pressure, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute}
      priorityClassName: system-node-critical
      serviceAccountName: s1u-robot
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      hostPID: true
      hostNetwork: true
      {{- if .Values.orinPayloads }}
      # Each payload's /payload into this Pod, for the orin container to place on the Orin.
      initContainers:
        {{- range $i, $payload := splitList "," .Values.orinPayloads }}
        - name: payload-{{ $i }}
          image: {{ index (splitList "=" $payload) 1 }}
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec, 'rm -rf /payloads/{{ index (splitList "=" $payload) 0 }} && mkdir -p /payloads/{{ index (splitList "=" $payload) 0 }} && cp -a /payload/. /payloads/{{ index (splitList "=" $payload) 0 }}/']
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: payloads, mountPath: /payloads}
        {{- end }}
      {{- end }}
      containers:
        - name: tuner
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          workingDir: /s1u/tuner
          command: [/usr/bin/python3, /s1u/tuner/node_tuner.py]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: S1U_IMAGE, value: "{{ .Values.image }}"}
            - {name: S1U_NODE_WANTED, value: "{{ .Values.profile }}"}
            - {name: S1U_NODE_REBOOT, value: "{{ .Values.reboot }}"}
            - {name: S1U_SITE_TIME_SOURCE, value: "{{ .Values.timeSource }}"}
            - {name: S1U_NODE_ROLLOUT, value: "{{ .Values.rollout }}"}
            - {name: S1U_NODE_ROLLOUT_SECONDS, value: "{{ .Values.rolloutSeconds }}"}
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: host, mountPath: /host}
        # The robot's Orin (orin/orin.py) over the robot's internal network. Its login is mounted in memory, never on
        # disk; it has no capability and writes only to directories of root's.
        - name: orin
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/python3, /s1u/orin/orin.py]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: S1U_NODE_PROFILE, value: /s1u/tuner/node_profile.env}
            - {name: S1U_NODE_WANTED, value: "{{ .Values.profile }}"}
            - {name: S1U_ORIN_RETIRED_UNITS, value: "{{ .Values.orinRetiredUnits }}"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: orin-access, mountPath: /orin-access, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
            - {name: host, mountPath: /host}
            - {name: state, mountPath: /state}
            - {name: in-use, mountPath: /in-use, readOnly: true}
            - {name: payloads, mountPath: /payloads, readOnly: true}
        # The robot's power, driver start and restart (device/power.py): the vendor's buttons through its ROS master,
        # on a Unix socket only, which RLark reaches on the node. No capability: ROS over the host's network.
        - name: power
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -c, "source /opt/ros/noetic/setup.bash && exec python3 /s1u/device/power.py"]
          env:
            - {name: S1U_NODE_PROFILE, value: /s1u/tuner/node_profile.env}
            - {name: S1U_SERVICE_SOCKET, value: /services/s1u-power.sock}
            - {name: S1U_AUTO_DRIVER, value: "{{ if eq .Values.autoDriver "true" }}1{{ else }}0{{ end }}"}
            - {name: S1U_AUTO_POWER, value: "{{ if eq .Values.autoPower "true" }}1{{ else }}0{{ end }}"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: services, mountPath: /services}
            - {name: in-use, mountPath: /in-use, readOnly: true}
        # The robot's camera video (device/video_server.py): the body's cameras from the vendor's ROS topics to MediaMTX
        # (WebRTC :18889, a viewing session's token checked on a loopback port), the camera wall's strip from the device
        # layer's thumbnails (/run/rlark/s1u/preview.bin); its control a Unix socket only, which RLark reaches on the node.
        - name: video
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -c, "source /opt/ros/noetic/setup.bash && exec python3 /s1u/device/video_server.py"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: S1U_NODE_ADDRESS
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - {name: S1U_NODE_PROFILE, value: /s1u/tuner/node_profile.env}
            - {name: S1U_BODIES, value: /s1u/tuner/bodies.json}
            - {name: S1U_SERVICE_SOCKET, value: /services/s1u-video.sock}
            - {name: S1U_VIDEO_DIRECTORY, value: /video}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: "2", memory: 512Mi}
          volumeMounts:
            - {name: services, mountPath: /services}
            - {name: host, mountPath: /host, readOnly: true}
            - {name: video, mountPath: /video}
        # The robot's clock held to the site's time (clock/clock.py): it trims the frequency of the NIC hardware clock
        # at the root of the vendor's own time chain. Privileged for that clock's device (/dev/ptpN).
        - name: clock
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/python3, /s1u/clock/clock.py]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: S1U_NODE_PROFILE, value: /s1u/tuner/node_profile.env}
            - {name: S1U_NODE_WANTED, value: "{{ .Values.profile }}"}
            - {name: S1U_SITE_TIME_SOURCE, value: "{{ .Values.timeSource }}"}
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: host, mountPath: /host}
      volumes:
        - name: orin-access
          secret:
            secretName: {{ .Values.orinAccessSecret }}
            defaultMode: 0400
            # The node profile does not wait for the Orin's login to exist.
            optional: true
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: payloads
          emptyDir: {sizeLimit: 256Mi}
        - name: video
          emptyDir: {sizeLimit: 64Mi}
        - name: host
          hostPath: {path: /run/rlark/s1u, type: DirectoryOrCreate}
        # What must outlast a boot and is root's (the Orin's record).
        - name: state
          hostPath: {path: /var/lib/rlark/s1u, type: DirectoryOrCreate}
        # The node-local services RLark reaches on this node (their Unix sockets).
        - name: services
          hostPath: {path: /run/rlark/services, type: DirectoryOrCreate}
        # What each component of the host marks in use (a Station attached to the device layer, the vendor driver).
        - name: in-use
          hostPath: {path: /run/rlark/in-use, type: DirectoryOrCreate}
