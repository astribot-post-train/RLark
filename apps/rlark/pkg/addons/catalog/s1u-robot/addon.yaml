name: s1u-robot
displayName: S1U 机器人节点
category: other
version: v1.0.0
description: |
  S1U 机器人 x86 的机型配置：新机器入网后套上，之后一直保持。一个 DaemonSet（s1u-robot），镜像由 RLark 构建（extensions/s1u），四个容器：
  1. 节点调优（tuner）：让宿主机符合节点规格（内核隔离核、厂商进程和 k8s 的 CPU 范围、kubelet 的 CPU 管理和内存预留、调频策略、调度器参数，开机时由宿主机上的单元重新套上），结果写在节点标签 rlark.io/node-profile-state（ok / drift / kubelet-restart-required / reboot-required）；新机器要重启一次才生效，空闲时自己重启。按 S1U 节点规格核对整台：标签 rlark.io/node-conformance（ok / not-ok），三段指纹和不成立的项写在节点注解上。机器人在用（厂商驱动在跑、电机带电，或别的组件在 /run/rlark/in-use 下标了在用，比如设备层接着 Station）时不重启，原因写在报告注解里。
  2. Orin（orin）：经机器人内网把本机器人的 Orin 对到声明：x86 经 Orin 上网的单元（s1u-orin-uplink）、相机的 USB 规则和设备层请求的相机 USB 复位、站点的 adb 密钥，以及 orinPayloads 声明的载荷（镜像里的 /payload，按版本放到 Orin、开机自启、机器人空闲且轮到它那一批时才切换）。没有人登录 Orin。Orin 的 ssh 主机密钥首次信任后记在节点上，变了就停下，等人在节点注解 s1u.rlark.io/orin-host-key-confirm 上确认新的指纹。状态：标签 s1u.rlark.io/orin-state，注解 s1u.rlark.io/orin。
  3. 时钟（clock）：声明了站点时间源时，微调厂商时间链源头那块网卡硬件时钟的速率，把机器人的 x86 和 Orin 一起对到站点时间；不改厂商的进程和文件。没声明时什么都不做。状态：标签 rlark.io/clock-state。
  4. 电源（power）：厂商控制中心的“电源 / 启动 / 重启”三个按钮，经宿主机上厂商的 ROS 执行，规则同厂商页面（驱动在跑时不下电除非强制、下电后 10 秒内不上电、驱动只在上电后启动）；机器人在用时不下电、不重启，除非强制并写明原因。只监听本机 Unix socket /run/rlark/services/s1u-power.sock，由 RLark 在节点上转发并记录是谁按的。
  会让机器人离线或停工的动作（规格要的重启、载荷换版本）按 rollout 分批放行：节点标签 rlark.io/rollout-wave 是批次。人要求的整机重启：节点标签 rlark.io/restart-request（任意值，同一个值只做一次），结果在注解 rlark.io/restart-request-state。
  宿主机上的文件都在 /etc/rlark/s1u、/run/rlark/s1u、/var/lib/rlark/s1u 和带 rlark-s1u 名字的单元与配置片段里；设备层读宿主机上的 /etc/rlark/s1u/node_profile.env 得到它的 CPU 和机器人地址。
icon: cpu

parameters:
  - name: image
    displayName: 镜像
    description: |
      本 Addon 的镜像（RLark 构建，extensions/s1u），带 digest，例如 registry.rlark.internal:5443/rlark/s1u-robot@sha256:…
    type: string
    default: ""
    required: true

  - name: nodeSelector
    displayName: 节点选择器
    description: |
      S1U 机器人 x86 节点的标签（label=value）。入网时由 RLark 按准入记录打上。
    type: string
    default: "rlark.io/robot-model=s1u"
    required: true

  - name: reboot
    displayName: 自动重启
    description: |
      节点规格需要重启才生效时怎么办。idle（默认）= 机器人空闲时由节点调优自己做：要整机重启的（新机器第一次装规格、内核隔离核变了），在厂商驱动没运行、电机没上电、没有别的组件标着在用时经厂商的整机重启（Orin 和 x86 一起）；只要重启 kubelet 的，在驱动没运行、没有别的组件标着在用时只重启 kubelet，Pod 不停。机器人在用时一直等，不算尝试，原因写在节点的报告注解里。重启确实发生而规格仍不成立的，这份规格不再重启；重启没有发生的，五分钟后再试，最多三次（记在节点注解 rlark.io/node-profile-restart 上）。never = 只把标签置为 reboot-required / kubelet-restart-required，等运维重启。
    type: enum
    default: idle
    options: [idle, never]
    required: true

  - name: timeSource
    displayName: 站点时间源
    description: |
      机器人时钟要对到的 NTP 服务器（地址或名字，机器人经站点隧道能到），按站点声明，不依赖场地的路由器。空 = 不对时，时钟按厂商自己的时间链走、clock-state 是 no_source。声明了就要求每台机器人 clock-state=locked（与它相差 50 ms 以内），否则节点不符合规格。
    type: string
    default: ""
    required: false

  - name: rollout
    displayName: 分批执行
    description: |
      会让机器人离线或停工的动作（规格需要的整机重启和 kubelet 重启、Orin 载荷切换版本）怎么放行。staged（默认）= 分批：节点标签 rlark.io/rollout-wave 是批次（整数，没有标签的是最后一批）；一批要等更早各批里 Ready 的机器人都用同一个镜像做完满 rolloutSeconds、至少一台做完、没有一台失败，才动手。paused = 所有机器人都不做这些动作。all = 不分批，各台只看自己是否空闲。每台在哪一步、在等谁：节点标签 rlark.io/rollout-state 和注解 rlark.io/rollout。Pod 本身仍然所有机器人同时换版本，被拦住的是动作。
    type: enum
    default: staged
    options: [staged, paused, all]
    required: true

  - name: rolloutSeconds
    displayName: 分批观察时长（秒）
    description: 更早一批做完之后要保持多久，后一批才动手。
    type: string
    default: "600"
    required: true

  - name: profile
    displayName: 节点规格
    description: |
      installed（默认）= 让宿主机符合节点规格并保持。removed = 撤除：把宿主机上节点规格写的文件全部删掉、内核命令行恢复成装规格之前的（下次开机起生效，不自己重启）；Orin 上的载荷（各自的 install remove）、相机的 USB 规则、adb 密钥和本 Addon 的登录公钥一并删除（在没有组件标着在用时）；时钟的微调归零。x86 经 Orin 上网的单元留着：那是机器人到站点的路。三个标签都变成 removed 之后再卸载本 Addon。
    type: enum
    default: installed
    options: [installed, removed]
    required: true

  - name: orinPayloads
    displayName: Orin 上的载荷
    description: |
      要放到 Orin 上并开机自启的东西，NAME=IMAGE，多个用英文逗号分隔，例如 quest-bridge=registry.rlark.internal:5443/fleet/quest-bridge@sha256:…。每个镜像里 /payload 目录就是载荷（镜像需带 /bin/sh 和 cp）：其中可执行的 install 由 root 在 Orin 上执行——install 放置并启用它的单元，install restart 切到新版本时启动，install remove 撤除；同目录的 rlark.env 给出机器人的地址和账户。版本是 /payload 内容的哈希。不再声明的载荷会被撤除。空 = 没有载荷。
    type: string
    default: ""
    required: false

  - name: orinRetiredUnits
    displayName: Orin 上要撤掉的旧单元
    description: |
      换名以前留在 Orin 上、做同一件事的 systemd 单元名（不带 .service），多个用英文逗号分隔：停掉、删除，并立刻重启 s1u-orin-uplink（停旧单元会删掉两者共有的转发规则）。只在换名那一批用，之后清空。
    type: string
    default: ""
    required: false

  - name: autoDriver
    displayName: 上电后自动启动驱动
    description: true（默认）= 电机每次上电后自动启动一次厂商驱动（操作员停掉的不会再起）；false = 由人按“启动”。
    type: enum
    default: "true"
    options: ["true", "false"]
    required: true

  - name: autoPower
    displayName: 开机自动上电
    description: true = 服务启动时（开机）自动给电机上电；false（默认）= 由人按“电源”。给没人在旁边的机器人上电是站点的决定。
    type: enum
    default: "false"
    options: ["true", "false"]
    required: true

  - name: orinAccessSecret
    displayName: Orin 登录凭据的 Secret
    description: |
      rlark-system 里的站点级 Secret：ssh_key（x86 登录 Orin 的私钥）、password（Orin 账户的口令，也是 sudo 的），可选 adb_key（头显信任的 adb 私钥，放到 Orin 的 ~/.android/adbkey_rlark）。只以内存卷挂进 orin 容器。
    type: string
    default: s1u-orin-access
    required: true

  - name: imagePullSecret
    displayName: 拉镜像的 Secret
    description: |
      rlark-system 里拉本 Addon 镜像和载荷镜像用的 Secret 名（RLark「镜像仓库」凭据分发到本集群的 ir-…）。Addon 的 Pod 要在这里写明；仓库不要认证时留空。
    type: string
    default: ""
    required: false
