openapi: 3.0.3
info:
  title: RLark Gateway CRD API Subset
  description: >-
    A maintained subset of routes registered by the RLark Gateway, focused on CRD operations and selected supporting endpoints; this is not a complete Gateway specification. The Gateway login endpoint
    issues a token and the certificate revocation route enforces an administrator
    role. Deploy the Gateway on a trusted network or behind an authenticated
    access-control layer. Domain resources
    group virtual addresses and scope cross-cluster forwarding; they do not
    isolate underlying infrastructure or ordinary Kubernetes networking. The
    certificate-revocation route requires an administrator and a compatible
    Server with durable revocation storage.
  version: v1alpha1

servers:
  - url: http://localhost:8080
    description: Standalone Gateway default

externalDocs:
  description: API Reference and usage examples
  url: ./reference/

tags:
  - name: Cluster
    description: Registered data-plane cluster summaries and details
  - name: Job
    description: Cluster-scoped Job resources
  - name: Node
    description: Namespaced Node resources
  - name: Task
    description: Namespaced Task resources
  - name: Image
    description: Images referenced by Jobs and Tasks
  - name: Observability
    description: Gateway Prometheus metrics
  - name: Station
    description: Experimental Station identity administration

paths:
  /api/v1/certificates/revoke:
    post:
      summary: Persist certificate revocation (administrator only)
      description: Requires a compatible Server. An ambiguous failure may be retried with the same identity; existing sessions are not terminated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert_type, serial_number, subject_key_id]
              properties:
                cert_type: {type: string, enum: [x509, ssh]}
                serial_number: {type: string, description: Canonical decimal serial}
                subject_key_id: {type: string, description: Lowercase hexadecimal for X.509; SSH key ID for SSH}
                reason: {type: string}
      responses:
        '200':
          description: Server confirmed durable storage
          content:
            application/json:
              schema:
                type: object
                properties:
                  persisted: {type: boolean, enum: [true]}
        '400': {description: Invalid certificate identity}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
        '502': {description: Server failed or did not confirm persistence; outcome may be unknown}
        '503': {description: Server connection not configured}
  /api/v1/image-registries/{id}/password:
    get:
      tags: [Image]
      summary: Reveal a registry password (administrator only)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Password; response is not cacheable
          content:
            application/json:
              schema:
                type: object
                required: [password]
                properties:
                  password: {type: string, format: password}
        '400': {description: Invalid registry ID}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
  /api/v1/node-networks/{name}:
    get:
      tags: [Station]
      summary: Get the verified node network summary (preview)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current, stale or unreported WireGuard observation
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [current, stale, unreported]}
                  interface: {type: string}
                  addresses: {type: array, items: {type: string}}
                  reportedAt: {type: string, format: date-time}
        '400': {description: Missing cluster ID}
        '404': {description: Cluster or node not visible}
        '409': {description: Ambiguous cluster namespace}
        '503': {description: Verified observation unavailable}
  /api/v1/site-nodes/{name}:
    get:
      tags: [Station]
      summary: Look up one site node by Node name (read-only; identity, network address, robot)
      description: >-
        The interface for consumers that place work on machines, such as a Fleet Run. A caller keeps
        the cluster ID and Node name and reads the rest here. site_node_id is stable across reinstalls;
        binding_version increases when an administrator rebinds the identity to a reinstalled machine;
        network.address is the one address every other member reaches the node at. The answer says
        nothing about what runs on the machine.
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: The site node bound to this Node name
          content:
            application/json:
              schema:
                type: object
                required: [cluster_id, node_name, site_node_id, sequence, binding_version, phase, online]
                properties:
                  cluster_id: {type: string}
                  node_name: {type: string}
                  site_node_id: {type: string}
                  sequence: {type: integer}
                  binding_version: {type: integer}
                  phase: {type: string, enum: [Bound, Offline, Conflict, Retired]}
                  online: {type: boolean}
                  last_seen_time: {type: string, format: date-time}
                  robot_id: {type: string}
                  workstation_id: {type: string}
                  network:
                    type: object
                    description: Absent until the node has enrolled under its current binding
                    properties:
                      state: {type: string, enum: [Pending, Enrolled, Rejected]}
                      site: {type: string}
                      role: {type: string, enum: [Leaf, Hub]}
                      address: {type: string}
                      tunnel_address: {type: string}
        '400': {description: Missing cluster ID}
        '404': {description: Cluster or site node not found}
        '409': {description: Ambiguous cluster namespace or node binding}
        '502': {description: Management API request failed}
        '503': {description: Station API unavailable}
  /api/v1/station/stations:
    get:
      tags: [Station]
      summary: List registered Station identities (administrator only)
      parameters:
        - {name: cluster_id, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
        - {name: continue, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Namespaced Station records from the current management API
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object}}
                  continue: {type: string}
        '400': {description: Invalid list limit}
        '403': {description: Administrator role required}
        '502': {description: Management Kubernetes API unavailable}
  /api/v1/station/stations/{name}:
    get:
      tags: [Station]
      summary: Get a Station by name and registered Cluster (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Station record}
        '400': {description: Cluster ID required}
        '403': {description: Administrator role required}
        '404': {description: Cluster or Station not found}
        '409': {description: Cluster namespace mapping is ambiguous}
        '502': {description: Management Kubernetes API unavailable}
  /api/v1/station/rebinds:
    post:
      tags: [Station]
      summary: Create an administrator-approved Station rebind operation
      description: Requires an admin JWT and a strict JSON body no larger than 16 KiB. Unknown fields are rejected. The Gateway resolves the namespace from the registered Cluster, verifies the Station object UID and expected binding version, and creates an idempotent StationRebind resource. The controller independently verifies the target Node against the member Kubernetes API and refuses a Node UID already owned by another Station before changing the binding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, request_id, station_name, station_uid, expected_binding_version, target_node_name, target_node_uid, reason]
              properties:
                cluster_id: {type: string, maxLength: 128}
                request_id: {type: string, minLength: 1, maxLength: 128}
                station_name: {type: string, maxLength: 253}
                station_uid: {type: string, maxLength: 128}
                expected_binding_version: {type: integer, format: int64, minimum: 1}
                target_node_name: {type: string, maxLength: 253}
                target_node_uid: {type: string, maxLength: 128}
                target_system_uuid: {type: string, maxLength: 128}
                reason: {type: string, minLength: 1, maxLength: 1024}
      responses:
        '202': {description: Operation created or an identical prior request returned}
        '400': {description: Invalid request}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
        '404': {description: Cluster or Station not found}
        '409': {description: Request ID conflict, Station UID mismatch, or binding version changed}
        '502': {description: Management Kubernetes API failure}
        '503': {description: Station API unavailable}
  /api/v1/station/rebinds/{name}:
    get:
      tags: [Station]
      summary: Get a Station rebind operation (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Current asynchronous operation state}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
        '404': {description: Cluster or operation not found}
        '502': {description: Management Kubernetes API failure}
        '503': {description: Station API unavailable}
  /api/v1/station/observations:
    get:
      tags: [Station]
      summary: List Station observations for a registered Cluster (administrator only)
      parameters:
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
        - {name: continue, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Latest verified observations from the mapped member namespace}
        '400': {description: Cluster ID required or invalid limit}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
        '404': {description: Cluster not found}
        '502': {description: Management Kubernetes API failure}
        '503': {description: Station API unavailable}
  /api/v1/images:
    get:
      tags: [Image]
      summary: List used images
      description: Returns images referenced by current Jobs and Tasks, with usage counts and last-used timestamps.
      operationId: listImages
      responses:
        '200':
          description: Image usage records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUsageList'

  /api/v1/image-registries/{id}/repositories:
    get:
      tags: [Image]
      summary: List a registry's repositories (administrator only)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: last, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of repository names and an optional next cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: string}}
                  next: {type: string}
        '400': {description: Invalid parameter}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
        '502': {description: Registry unavailable, unsupported, or not allowlisted}

  /api/v1/image-registries/{id}/tags:
    get:
      tags: [Image]
      summary: List registry repository tags (administrator only)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: repository, in: query, required: true, schema: {type: string}}
        - {name: last, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of tags and an optional next cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: string}}
                  next: {type: string}
        '400': {description: Invalid parameter}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
        '502': {description: Registry unavailable, unsupported, or not allowlisted}

  /api/v1/image-registries/{id}/manifest:
    get:
      tags: [Image]
      summary: Read the manifest digest for a tag (administrator only)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: repository, in: query, required: true, schema: {type: string}}
        - {name: tag, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Manifest digest
          content:
            application/json:
              schema:
                type: object
                properties:
                  digest: {type: string}
        '400': {description: Invalid parameter}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
        '502': {description: Registry unavailable, unsupported, or not allowlisted}

  /metrics:
    get:
      tags: [Observability]
      summary: Get Gateway metrics
      description: Returns Gateway metrics in the Prometheus text exposition format.
      operationId: readGatewayMetrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # ─── Cluster Collection ──────────────────────────────────────────
  /api/v1/clusters:
    get:
      tags: [Cluster]
      summary: List clusters
      description: Lists registered Cluster resources with aggregated Node counts.
      operationId: listClusters
      responses:
        '200':
          description: Cluster summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterInfoListResponse'
        '500':
          description: Failed to list Clusters or aggregate their Nodes

  /api/v1/clusters/{cluster_id}:
    get:
      tags: [Cluster]
      summary: Get cluster details
      description: Returns a Cluster summary and all Nodes in its authoritative agent namespace.
      operationId: getCluster
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetailResponse'
        '404':
          description: Cluster not found
        '500':
          description: Failed to read the Cluster or list Nodes in its agent namespace

  /api/v1/clusters/{cluster_id}/cordon:
    post:
      tags: [Cluster]
      summary: Cordon a cluster
      description: Administrator-only. Stops new task placement on the cluster.
      operationId: cordonCluster
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Cluster cordoned}
        '404': {description: Cluster not found}

  /api/v1/clusters/{cluster_id}/uncordon:
    post:
      tags: [Cluster]
      summary: Uncordon a cluster
      description: Administrator-only. Resumes new task placement on the cluster. A delisted or draining cluster must be restored or finish draining first.
      operationId: uncordonCluster
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Cluster uncordoned}
        '404': {description: Cluster not found}
        '409': {description: Cluster cannot be uncordoned in its current lifecycle state}

  /api/v1/clusters/{cluster_id}/drain:
    post:
      tags: [Cluster]
      summary: Drain a cluster
      description: Administrator-only. Stops RLark Tasks in the cluster while the desired draining state remains enabled.
      operationId: drainCluster
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Cluster drain requested}
        '404': {description: Cluster not found}

  /api/v1/clusters/{cluster_id}/undrain:
    post:
      tags: [Cluster]
      summary: Cancel cluster drain
      description: Administrator-only. Cancels draining and restores the cluster's pre-drain cordon state.
      operationId: undrainCluster
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Cluster drain cancelled}
        '404': {description: Cluster not found}
        '409': {description: Delisted clusters must be restored before their drain can be cancelled}

  /api/v1/clusters/{cluster_id}/delist:
    post:
      tags: [Cluster]
      summary: Delist a cluster
      description: Administrator-only. Stops showing the cluster and its Nodes to users. The cluster can be restored.
      operationId: delistCluster
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Cluster delisted}
        '404': {description: Cluster not found}
        '409': {description: Cluster must finish draining before it can be delisted}

  /api/v1/clusters/{cluster_id}/delete:
    post:
      tags: [Cluster]
      summary: Delete a cluster
      description: Administrator-only. Permanently deletes the Cluster resource. The Cluster controller cleans up owned data-plane resources before final deletion.
      operationId: deleteCluster
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Cluster deletion requested}
        '404': {description: Cluster not found}

  /api/v1/clusters/{cluster_id}/restore:
    post:
      tags: [Cluster]
      summary: Restore a cluster
      description: Administrator-only. Makes a previously hidden cluster visible again.
      operationId: restoreCluster
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Cluster restored}
        '404': {description: Cluster not found}

  # ─── Job Collection ───────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/jobs:
    get:
      tags: [Job]
      summary: List jobs
      description: List jobs resources.
      operationId: listJob
      parameters:
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/continue'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/fieldSelector'
        - $ref: '#/components/parameters/labelSelector'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'

    post:
      tags: [Job]
      summary: Create a Job
      description: Create a Job resource.
      operationId: createJob
      parameters:
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  # ─── Job Named ────────────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/jobs/{name}:
    get:
      tags: [Job]
      summary: Get a Job
      description: Get a Job resource.
      operationId: readJob
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not Found

    put:
      tags: [Job]
      summary: Replace a Job
      description: Replace a Job resource.
      operationId: replaceJob
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not Found

    patch:
      tags: [Job]
      summary: Patch a Job
      description: Patch a Job resource.
      operationId: patchJob
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
        - $ref: '#/components/parameters/force'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/strategic-merge-patch+json:
            schema:
              $ref: '#/components/schemas/Job'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Job'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not Found

    delete:
      tags: [Job]
      summary: Delete a Job
      description: Delete a Job resource.
      operationId: deleteJob
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Not Found

  # ─── Job Start ───────────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/jobs/{name}/start:
    post:
      tags: [Job]
      summary: Start a Job
      description: >-
        Unified start endpoint. If the Job is active (KCP has the CR), patches
        spec.suspended=false directly. If archived (KCP CR was removed after stop),
        restores the Job from the persistence backend and creates a new CR.
      operationId: startJob
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Started Job (patched or restored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found or not archived
        '503':
          description: Persistence backend not configured

  # ─── Job Logs ────────────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/jobs/{name}/logs:
    get:
      tags: [Job]
      summary: Get Job logs
      description: >-
        Queries the configured backend when from is supplied. If no backend is
        configured, no from value is supplied, or the backend query fails, the
        handler falls back to current Pod logs.
      operationId: readJobLogs
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/logFrom'
        - $ref: '#/components/parameters/logTo'
        - $ref: '#/components/parameters/logTask'
        - $ref: '#/components/parameters/logPod'
        - name: query
          in: query
          description: Raw backend-specific log query.
          schema: {type: string}
        - name: cursor
          in: query
          description: Backend pagination cursor returned as nextCursor.
          schema: {type: string}
        - name: limit
          in: query
          description: >-
            Maximum number of backend log entries to return. Must be a positive
            integer no greater than 1000.
          schema: {type: integer, format: int32, default: 99, minimum: 1, maximum: 1000}
        - name: order
          in: query
          description: Use asc for ascending backend results; all other values are descending.
          schema: {type: string, default: desc}
      responses:
        '200':
          description: Backend log entries or Pod-log fallback
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BackendLogResponse'
                  - $ref: '#/components/schemas/PodLogResponse'
        '400':
          description: A query parameter is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to list Tasks for the Pod fallback

  /api/v1/rlinf.io/v1alpha1/jobs/{name}/logs/label-values:
    get:
      tags: [Job]
      summary: List Job log label values
      description: Returns unique values for a backend log label; label defaults to pod. Returns an empty values array when no backend is configured.
      operationId: listJobLogLabelValues
      parameters:
        - $ref: '#/components/parameters/name'
        - name: label
          in: query
          schema: {type: string, default: pod}
        - $ref: '#/components/parameters/logFrom'
        - $ref: '#/components/parameters/logTo'
        - $ref: '#/components/parameters/logTask'
        - $ref: '#/components/parameters/logPod'
      responses:
        '200':
          description: Unique label values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLabelValuesResponse'
        '500':
          description: Log backend query failed

  # ─── Node Collection ─────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/nodes:
    get:
      tags: [Node]
      summary: List nodes
      description: List nodes resources.
      operationId: listNode
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/continue'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/fieldSelector'
        - $ref: '#/components/parameters/labelSelector'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'

    post:
      tags: [Node]
